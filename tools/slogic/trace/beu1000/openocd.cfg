# BE-U1000 на EVU-BA-2.5 через FT2232H на плате — для настройки трассера по SBA.
# Скрипты — из Baikal MCU SDK 2.3.0 (запуск с -s <SDK>/Tools/OpenOCD/share/openocd/scripts).
# В отличие от board/baikal/EVU_BA_2_5.cfg: ядро не останавливается (трасса нужна с бегущего ядра),
# свои порты (рядом может жить OpenOCD стенда STM32), адаптер — по месту на шине USB.

source [find target/baikal/BE_U1000/registers.cfg]
source [find interface/baikal/evu-ba_ftdi.cfg]
if {[info exists ::env(RLN_BEU_USB)]} {
	adapter usb location $::env(RLN_BEU_USB)
}

debug_level 1
gdb port 3337
telnet port 4446
tcl port 6668

source [find target/baikal/common/taps.cfg]
source [find target/baikal/common/include.cfg]

targets CORE_0
# без этого read_memory на бегущем ядре лезет в регистры ядра (priv) и падает; SBA работает и так
riscv virt2phys_mode off
# set_mem_access из taps.cfg SDK применился к последней созданной цели (CORE_2)
riscv set_mem_access sysbus
init
