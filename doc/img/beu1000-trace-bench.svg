<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 650" width="1190" height="650" font-family="'Segoe UI','DejaVu Sans',Helvetica,Arial,sans-serif" role="img"><title>Стенд трассы BE-U1000</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker></defs><rect x="0" y="0" width="1190" height="650" rx="14" fill="#FFFFFF"/><text x="24" y="34" font-size="18" font-weight="700" fill="#111827" text-anchor="start">Стенд трассы BE-U1000: N-Trace через PIB, приём SLogic16U3, чтение через JTAG</text><text x="24" y="56" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start">Образ tracela грузится только в SRAM ПЛИС; трассер BE-U1000 настраивается по SBA из OpenOCD Baikal MCU SDK.</text><rect x="420" y="80" width="340" height="92" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.6"/><text x="432" y="103" font-size="14" font-weight="700" fill="#111827" text-anchor="start">ПК: Windows + WSL2</text><text x="432" y="123" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">Gowin EDA 1.9.12 — сборка (gw_sh.exe из WSL)</text><text x="432" y="140" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">OpenOCD Baikal (au/mcu-sdk), openFPGALoader</text><text x="432" y="157" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">usbipd-win: USB-устройства → WSL</text><rect x="24" y="214" width="262" height="276" rx="10" fill="#FFF1E6" stroke="#E8590C" stroke-width="1.6"/><text x="36" y="237" font-size="14" font-weight="700" fill="#111827" text-anchor="start">EVU-BA-2.5 (BE-U1000)</text><text x="36" y="257" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">ядро 0: fw/ в TCMA, 25…200 МГц</text><text x="36" y="274" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">PIB 4 бита, TRC_CLK = tclk ≤ 50 МГц</text><rect x="36" y="285" width="238" height="20" rx="4" fill="#FFFFFF" stroke="#F4B183" stroke-width="1"/><text x="44" y="300" font-size="12" font-weight="600" fill="#111827" text-anchor="start">PB0 … PB3</text><text x="150" y="300" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">→</text><text x="170" y="300" font-size="12" font-weight="400" fill="#111827" text-anchor="start">CH8 … CH11</text><rect x="36" y="307" width="238" height="20" rx="4" fill="#FFFFFF" stroke="#F4B183" stroke-width="1"/><text x="44" y="322" font-size="12" font-weight="600" fill="#111827" text-anchor="start">PB4</text><text x="150" y="322" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">→</text><text x="170" y="322" font-size="12" font-weight="400" fill="#111827" text-anchor="start">CH12</text><rect x="36" y="329" width="238" height="20" rx="4" fill="#FFFFFF" stroke="#F4B183" stroke-width="1"/><text x="44" y="344" font-size="12" font-weight="600" fill="#111827" text-anchor="start">XP10: 1, 2, 3, 19</text><text x="150" y="344" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">→</text><text x="170" y="344" font-size="12" font-weight="400" fill="#111827" text-anchor="start">PIB_D[0..3]</text><rect x="36" y="351" width="238" height="20" rx="4" fill="#FFFFFF" stroke="#F4B183" stroke-width="1"/><text x="44" y="366" font-size="12" font-weight="600" fill="#111827" text-anchor="start">XP10: 6</text><text x="150" y="366" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">→</text><text x="170" y="366" font-size="12" font-weight="400" fill="#111827" text-anchor="start">PIB_CLK</text><rect x="36" y="373" width="238" height="20" rx="4" fill="#FFFFFF" stroke="#F4B183" stroke-width="1"/><text x="44" y="388" font-size="12" font-weight="600" fill="#111827" text-anchor="start">GND (XP10: 4, 20)</text><text x="150" y="388" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">→</text><text x="170" y="388" font-size="12" font-weight="400" fill="#111827" text-anchor="start">GND</text><text x="36" y="430" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">R5 снят: QSPI-флеш DD1 отрезана</text><text x="36" y="446" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">от PB0 (её S#); XP10 — после 0 Ом</text><text x="36" y="472" font-size="12" font-weight="600" fill="#111827" text-anchor="start">FTDI DD7 (JTAG + UART0) — на борту</text><rect x="330" y="214" width="510" height="360" rx="14" fill="none" stroke="#1C64F2" stroke-width="1.5" stroke-dasharray="6 5"/><text x="344" y="236" font-size="14" font-weight="700" fill="#1C64F2" text-anchor="start">Sipeed SLogic16U3</text><rect x="346" y="252" width="112" height="206" rx="10" fill="#FFF8DB" stroke="#E09400" stroke-width="1.6"/><text x="358" y="275" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Гребёнка</text><text x="358" y="295" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">CH8 … CH11</text><text x="358" y="312" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">CH12 — такт</text><text x="358" y="329" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">GND</text><text x="358" y="346" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start"></text><text x="358" y="363" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">штатный жгут</text><text x="358" y="380" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">~10 см,</text><text x="358" y="397" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">как у STM32</text><rect x="476" y="252" width="156" height="206" rx="10" fill="#FFF8DB" stroke="#E09400" stroke-width="1.6"/><text x="488" y="275" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Делители</text><text x="488" y="295" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">резисторные сборки</text><text x="488" y="312" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">+ конденсатор</text><text x="488" y="329" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start"></text><text x="488" y="346" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">k ≈ 0,47:</text><text x="488" y="363" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">3,0 В → 1,42 В</text><text x="488" y="380" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start"></text><text x="488" y="397" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">на шарике ПЛИС</text><text x="488" y="414" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">ниже LVCMOS33</text><rect x="650" y="252" width="174" height="206" rx="10" fill="#E8F0FF" stroke="#1C64F2" stroke-width="2.5"/><text x="662" y="275" font-size="14" font-weight="700" fill="#111827" text-anchor="start">GW5AT-15 MG132</text><text x="662" y="295" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">CH12 → N9 (GCLK)</text><text x="662" y="312" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">данные: IODELAY → IDDR</text><text x="662" y="329" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">IODELAY 224 (≈ 2,8 нс)</text><text x="662" y="346" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start"></text><text x="662" y="363" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">входы LVCMOS15UD33,</text><text x="662" y="380" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">порог ~0,75 В,</text><text x="662" y="397" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">буфер 8 Кслов × 32</text><rect x="650" y="480" width="174" height="78" rx="10" fill="#E6F6EC" stroke="#13924F" stroke-width="1.6"/><text x="662" y="503" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Разъём отладки</text><text x="662" y="523" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">TCK TDI TDO TMS</text><text x="662" y="540" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">RXD TXD, GND; 5V — нет</text><rect x="346" y="480" width="286" height="78" rx="10" fill="#E2F7F8" stroke="#0B8EA0" stroke-width="1.6"/><text x="358" y="503" font-size="14" font-weight="700" fill="#111827" text-anchor="start">USB-C: USB3 / USB2</text><text x="358" y="523" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">питание прибора; со своим</text><text x="358" y="540" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">образом USB нет (Windows: 0000:0002)</text><rect x="886" y="214" width="280" height="182" rx="10" fill="#E8F0FF" stroke="#1C64F2" stroke-width="1.6" stroke-dasharray="5 4"/><text x="898" y="237" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Образ tracela (SRAM)</text><text x="898" y="257" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">режим 2: IDDR от TRACECLK</text><text x="898" y="274" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">частотомер всех пяти линий</text><text x="898" y="291" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">65 536 полубайт за запись</text><text x="898" y="308" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">буфер → ER1 GW_JTAG (IR 0x42)</text><text x="898" y="325" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">команды → ER2 (IR 0x43)</text><text x="898" y="342" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start"></text><text x="898" y="359" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">запись — trace.py, разбор — ntrace.py</text><text x="898" y="376" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">трассер — ocd.py (tcl 6668)</text><rect x="886" y="446" width="280" height="112" rx="10" fill="#F3EBFF" stroke="#7C3AED" stroke-width="1.6"/><text x="898" y="469" font-size="14" font-weight="700" fill="#111827" text-anchor="start">FT2232H</text><text x="898" y="489" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">канал A — JTAG ПЛИС:</text><text x="898" y="506" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">ADBUS0 TCK, 1 TDI, 2 TDO, 3 TMS</text><text x="898" y="523" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">канал B — UART (не нужен)</text><text x="898" y="540" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">GND общий</text><path d="M286 352 L346 352" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a)"/><text x="316" y="344" font-size="11" font-weight="600" fill="#374151" text-anchor="middle">4 + 1</text><path d="M458 355 L476 355" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a)"/><path d="M632 355 L650 355" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a)"/><path d="M737 458 L737 480" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#a)"/><path d="M886 519 L824 519" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#a)"/><text x="855" y="511" font-size="11" font-weight="600" fill="#374151" text-anchor="middle">JTAG</text><path d="M1026 446 L1026 396" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#a)"/><path d="M155 214 L155 126 L420 126" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a)"/><text x="168" y="118" font-size="11" font-weight="600" fill="#374151" text-anchor="start">USB: FTDI DD7 (XS2)</text><path d="M346 519 L308 519 L308 152 L420 152" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a)"/><text x="316" y="144" font-size="11" font-weight="600" fill="#374151" text-anchor="start">USB</text><path d="M1166 446 L1176 446 L1176 126 L760 126" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a)"/><text x="1160" y="118" font-size="11" font-weight="600" fill="#374151" text-anchor="end">USB: FT2232H</text><text x="24" y="612" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">Порядок: openFPGALoader -m tracela.fs → ocd.py: load_image fw, pins 3, pll, tclk, pib_on, te_on → ntrace.py cal → ntrace.py cap, table.</text><text x="24" y="632" font-size="12" font-weight="600" fill="#111827" text-anchor="start">Итог: BTM и HTM чисто на TRC_CLK 25 и 50 МГц; ядро 200 МГц — BTM переполняет PIB, HTM нет; путь программы — по ELF.</text></svg>
