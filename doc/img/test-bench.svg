<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 800" width="1180" height="800" font-family="'Segoe UI','DejaVu Sans',Helvetica,Arial,sans-serif" role="img"><defs><marker id="a0B8EA0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0B8EA0"/></marker></defs><defs><marker id="a7C3AED" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker></defs><defs><marker id="aE8590C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E8590C"/></marker></defs><defs><marker id="a1C64F2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1C64F2"/></marker></defs><defs><marker id="a6B7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker></defs><defs><marker id="a13924F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#13924F"/></marker></defs><rect x="0" y="0" width="1180" height="800" rx="14" fill="#FFFFFF"/><text x="24" y="34" font-size="18" font-weight="700" fill="#111827" text-anchor="start">Отладочный стенд: макет зонда на Tang Nano 20K + CH569</text><text x="24" y="56" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start">Всё управляется с одного ПК; USB-коммутатор передёргивает питание устройств без рук.</text><rect x="330" y="84" width="480" height="130" rx="10" fill="#F3EBFF" stroke="#7C3AED" stroke-width="1.6"/><text x="342" y="107" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Хост-ПК (Linux)</text><text x="342" y="126" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">rln-trace, OpenOCD, PulseView / sigrok</text><text x="342" y="143" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">openFPGALoader / Gowin Programmer, wchisp</text><text x="342" y="160" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">Orbuculum, OpenCSD, pyftdi</text><text x="342" y="177" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">SSH / Telnet для удалённой отладки</text><rect x="700" y="262" width="300" height="84" rx="10" fill="#F4F4F5" stroke="#71717A" stroke-width="1.6"/><text x="712" y="285" font-size="14" font-weight="700" fill="#111827" text-anchor="start">USB-коммутатор</text><text x="712" y="304" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">хаб с управлением питанием портов</text><text x="712" y="321" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">(uhubctl): сброс без рук</text><rect x="24" y="420" width="180" height="130" rx="10" fill="#E2F7F8" stroke="#0B8EA0" stroke-width="1.6"/><text x="36" y="443" font-size="14" font-weight="700" fill="#111827" text-anchor="start">SLogic16U3</text><text x="36" y="462" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">логический анализатор</text><text x="36" y="479" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">16 кан., до 800 МС/с</text><text x="36" y="496" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">щупы на HSPI</text><text x="36" y="513" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">или линии трассы</text><rect x="224" y="420" width="200" height="130" rx="10" fill="#E6F6EC" stroke="#13924F" stroke-width="1.6"/><text x="236" y="443" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Плата CH569</text><text x="236" y="462" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">HydraUSB3 / WCH EVT</text><text x="236" y="479" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">USB3 SS → ПК</text><text x="236" y="496" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">HSPI 8 бит → ПЛИС</text><text x="236" y="513" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">прошивка: fw/</text><rect x="474" y="420" width="250" height="130" rx="10" fill="#E8F0FF" stroke="#1C64F2" stroke-width="2.5"/><text x="486" y="443" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Tang Nano 20K</text><text x="486" y="462" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">GW2AR-18 QN88 (как в зонде B)</text><text x="486" y="479" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">приём трассы, метки времени</text><text x="486" y="496" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">самотест PRBS</text><text x="486" y="513" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">BL616: JTAG ПЛИС + UART</text><rect x="774" y="420" width="190" height="130" rx="10" fill="#F4F4F5" stroke="#71717A" stroke-width="1.6"/><text x="786" y="443" font-size="14" font-weight="700" fill="#111827" text-anchor="start">FT2232H breakout</text><text x="786" y="462" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">канал A: кадры TPIU</text><text x="786" y="479" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">(sync bitbang, шаг 1)</text><text x="786" y="496" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">канал B: UART</text><text x="786" y="513" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">к USART2 цели</text><rect x="474" y="640" width="490" height="110" rx="10" fill="#FFF1E6" stroke="#E8590C" stroke-width="1.6"/><text x="486" y="663" font-size="14" font-weight="700" fill="#111827" text-anchor="start">STM32F4-Discovery (цель)</text><text x="486" y="682" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">STM32F407VG, 168 МГц; TRACECLK PE2, TRACED0–3 PE3–PE6</text><text x="486" y="699" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">встроенный ST-LINK/V2: SWD, прошивка, включение трассы</text><text x="486" y="716" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">PPS: выход таймера (TIM1_CH1, PA8) + ITM-маркер</text><path d="M380 214 L380 372 L114 372 L114 420" fill="none" stroke="#13924F" stroke-width="3" marker-end="url(#a13924F)" marker-start="url(#a13924F)"/><text x="250" y="366" font-size="12" font-weight="600" fill="#13924F" text-anchor="middle">USB3 SS</text><path d="M420 214 L420 392 L324 392 L324 420" fill="none" stroke="#13924F" stroke-width="3" marker-end="url(#a13924F)" marker-start="url(#a13924F)"/><path d="M790 214 L790 238 L850 238 L850 262" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)" marker-start="url(#a6B7280)"/><text x="856" y="252" font-size="12" font-weight="600" fill="#6B7280" text-anchor="start">USB2</text><path d="M760 346 L760 392 L660 392 L660 420" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)" marker-start="url(#a6B7280)"/><path d="M869 346 L869 420" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)" marker-start="url(#a6B7280)"/><path d="M970 346 L970 380 L1164 380 L1164 700 L964 700" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)" marker-start="url(#a6B7280)"/><text x="1158" y="640" font-size="12" font-weight="600" fill="#6B7280" text-anchor="end">USB (ST-LINK)</text><path d="M424 470 L474 470" fill="none" stroke="#1C64F2" stroke-width="2.5" marker-end="url(#a1C64F2)" marker-start="url(#a1C64F2)"/><text x="449" y="456" font-size="12" font-weight="600" fill="#1C64F2" text-anchor="middle">HSPI</text><path d="M774 470 L724 470" fill="none" stroke="#E8590C" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#aE8590C)"/><text x="749" y="456" font-size="12" font-weight="600" fill="#E8590C" text-anchor="middle">TPIU</text><path d="M599 640 L599 550" fill="none" stroke="#E8590C" stroke-width="2.5" marker-end="url(#aE8590C)"/><text x="593" y="612" font-size="12" font-weight="600" fill="#E8590C" text-anchor="end">TRACECLK + TRACED0–3</text><path d="M869 550 L869 640" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#a7C3AED)" marker-start="url(#a7C3AED)"/><text x="875" y="612" font-size="12" font-weight="600" fill="#7C3AED" text-anchor="start">UART</text><path d="M700 640 L700 550" fill="none" stroke="#0B8EA0" stroke-width="2" marker-end="url(#a0B8EA0)"/><text x="706" y="612" font-size="12" font-weight="600" fill="#0B8EA0" text-anchor="start">PPS</text><path d="M114 550 L114 588 L449 588 L449 486" fill="none" stroke="#0B8EA0" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a0B8EA0)"/><text x="250" y="582" font-size="12" font-weight="600" fill="#0B8EA0" text-anchor="middle">щупы анализатора</text><path d="M24 778 L52 778" stroke="#13924F" stroke-width="3"/><text x="60" y="783" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">USB3 SS</text><path d="M127.80000000000001 778 L155.8 778" stroke="#6B7280" stroke-width="1.8"/><text x="163.8" y="783" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">USB2</text><path d="M209.4 778 L237.4 778" stroke="#1C64F2" stroke-width="2.5"/><text x="245.4" y="783" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">HSPI</text><path d="M291.0 778 L319.0 778" stroke="#E8590C" stroke-width="2.5"/><text x="327.0" y="783" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">трасса</text><path d="M387.4 778 L415.4 778" stroke="#7C3AED" stroke-width="2"/><text x="423.4" y="783" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">UART</text><path d="M469.0 778 L497.0 778" stroke="#0B8EA0" stroke-width="1.8"/><text x="505.0" y="783" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">PPS</text><path d="M543.2 778 L571.2 778" stroke="#0B8EA0" stroke-width="1.8" stroke-dasharray="5 4"/><text x="579.2" y="783" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">щупы</text></svg>
