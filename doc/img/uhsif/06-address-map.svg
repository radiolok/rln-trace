<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 690" width="1280" height="690" font-family="'Segoe UI','DejaVu Sans',Helvetica,Arial,sans-serif" role="img"><rect x="0" y="0" width="1280" height="690" rx="14" fill="#FFFFFF"/><text x="24" y="34" font-size="18" font-weight="700" fill="#111827" text-anchor="start">Карта адресов UHSIF и связанных регистров</text><text x="24" y="56" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start">Не в масштабе. Названия наши: у WCH определения UHSIF_TypeDef нет, только UHSIF_BASE = 0x4003_8000.</text><text x="24" y="108" font-size="12" font-weight="700" fill="#4B5563" text-anchor="start">0x4003_8000</text><rect x="134" y="90" width="560" height="160" rx="10" fill="#E8F0FF" stroke="#1C64F2" stroke-width="1.6"/><text x="146" y="113" font-size="14" font-weight="700" fill="#111827" text-anchor="start">+0x000…0x12F  настройка: 76 слов из таблицы WCH</text><text x="146" y="132" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">+0x000 CTRL: [31] пуск, [4], [3] полярность PCLK</text><text x="146" y="149" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">+0x004 BUS: [20] фронт выдачи, [3:2] ширина</text><text x="146" y="166" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">+0x014 флаги прерываний: [11+n] канал n</text><text x="146" y="183" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">+0x024 записывается после таблицы, по режиму</text><text x="146" y="200" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">+0x0FC…0x108 регистры каналов 0…3</text><text x="146" y="217" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">+0x118, +0x11C общие разрешения (UHSIF_Start)</text><text x="24" y="278" font-size="12" font-weight="700" fill="#4B5563" text-anchor="start">0x4003_8180</text><rect x="134" y="260" width="560" height="54" rx="10" fill="#FFF8DB" stroke="#E09400" stroke-width="1.6"/><text x="146" y="283" font-size="14" font-weight="700" fill="#111827" text-anchor="start">+0x180…0x1A0  таблица переходов автомата</text><text x="146" y="302" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">по слову на переход, значимы 16 бит; 7 / 8 / 9 записей (FPGA / SOC / Master)</text><text x="24" y="342" font-size="12" font-weight="700" fill="#4B5563" text-anchor="start">0x4003_9000</text><rect x="134" y="324" width="560" height="72" rx="10" fill="#E6F6EC" stroke="#13924F" stroke-width="1.6"/><text x="146" y="347" font-size="14" font-weight="700" fill="#111827" text-anchor="start">+0x1000…0x17FF  сокеты: 32 × 0x40</text><text x="146" y="366" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">s = buf·4 + line; +0x00 дескриптор, +0x04 размер, +0x08 счётчик,</text><text x="146" y="383" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">+0x0C режим, +0x10 флаги, +0x14 разрешения</text><text x="24" y="424" font-size="12" font-weight="700" fill="#4B5563" text-anchor="start">0x4003_A000</text><rect x="134" y="406" width="560" height="54" rx="10" fill="#FDE8EC" stroke="#D6336C" stroke-width="1.6"/><text x="146" y="429" font-size="14" font-weight="700" fill="#111827" text-anchor="start">+0x2000…  микрокод, банк A</text><text x="146" y="448" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">по 16 байт на шаг, 3 слова; 199 / 198 / 11 шагов</text><text x="24" y="488" font-size="12" font-weight="700" fill="#4B5563" text-anchor="start">0x4003_B000</text><rect x="134" y="470" width="560" height="54" rx="10" fill="#FDE8EC" stroke="#D6336C" stroke-width="1.6"/><text x="146" y="493" font-size="14" font-weight="700" fill="#111827" text-anchor="start">+0x3000…  микрокод, банк B</text><text x="146" y="512" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">вторые 3 слова каждого шага</text><text x="134" y="548" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">Пустоты между блоками — не описаны, библиотека туда не обращается.</text><text x="740" y="102" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Вне блока</text><text x="740" y="134" font-size="12" font-weight="700" fill="#4B5563" text-anchor="start">0x4001_0000</text><rect x="850" y="116" width="400" height="63" rx="10" fill="#F4F4F5" stroke="#71717A" stroke-width="1.6"/><text x="862" y="139" font-size="14" font-weight="700" fill="#111827" text-anchor="start">AFIO_PCFR1</text><text x="862" y="158" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">[9:8] UHSIF_PORT_RM, [7:6] UHSIF_CLK_RM</text><text x="740" y="211" font-size="12" font-weight="700" fill="#4B5563" text-anchor="start">0x4002_1018</text><rect x="850" y="193" width="400" height="63" rx="10" fill="#F4F4F5" stroke="#71717A" stroke-width="1.6"/><text x="862" y="216" font-size="14" font-weight="700" fill="#111827" text-anchor="start">RCC_HBPCENR</text><text x="862" y="235" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">[18] UHSIFEN — тактирование блока</text><text x="740" y="288" font-size="12" font-weight="700" fill="#4B5563" text-anchor="start">0x4002_1030</text><rect x="850" y="270" width="400" height="63" rx="10" fill="#F4F4F5" stroke="#71717A" stroke-width="1.6"/><text x="862" y="293" font-size="14" font-weight="700" fill="#111827" text-anchor="start">RCC_CFGR2</text><text x="862" y="312" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">[7:6] UHSIFSRC, [5:0] UHSIFDIV</text><text x="740" y="365" font-size="12" font-weight="700" fill="#4B5563" text-anchor="start">0xE000_E110</text><rect x="850" y="347" width="400" height="63" rx="10" fill="#F4F4F5" stroke="#71717A" stroke-width="1.6"/><text x="862" y="370" font-size="14" font-weight="700" fill="#111827" text-anchor="start">PFIC IENR4 / IRER4 (+0x80)</text><text x="862" y="389" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">бит 17 — прерывание 145 (UHSIF)</text><text x="740" y="442" font-size="12" font-weight="700" fill="#4B5563" text-anchor="start">0x2000_0000</text><rect x="850" y="424" width="400" height="80" rx="10" fill="#E2F7F8" stroke="#0B8EA0" stroke-width="1.6"/><text x="862" y="447" font-size="14" font-weight="700" fill="#111827" text-anchor="start">RAM: окно дескрипторов</text><text x="862" y="466" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">0x2000_0000…0x201F_FFFF, указатель 16 бит × 32 байта</text><text x="862" y="483" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">покрывает всю внутреннюю RAM (до 0x2018_0000)</text><rect x="24" y="653" width="14" height="14" rx="3" fill="#E8F0FF" stroke="#1C64F2" stroke-width="1.6"/><text x="44" y="665" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">настройка</text><rect x="124.60000000000001" y="653" width="14" height="14" rx="3" fill="#FFF8DB" stroke="#E09400" stroke-width="1.6"/><text x="144.60000000000002" y="665" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">автомат</text><rect x="210.40000000000003" y="653" width="14" height="14" rx="3" fill="#E6F6EC" stroke="#13924F" stroke-width="1.6"/><text x="230.40000000000003" y="665" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">сокеты</text><rect x="288.80000000000007" y="653" width="14" height="14" rx="3" fill="#FDE8EC" stroke="#D6336C" stroke-width="1.6"/><text x="308.80000000000007" y="665" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">микрокод</text><rect x="382.00000000000006" y="653" width="14" height="14" rx="3" fill="#F4F4F5" stroke="#71717A" stroke-width="1.6"/><text x="402.00000000000006" y="665" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">системные регистры</text><rect x="549.2" y="653" width="14" height="14" rx="3" fill="#E2F7F8" stroke="#0B8EA0" stroke-width="1.6"/><text x="569.2" y="665" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">RAM</text></svg>
