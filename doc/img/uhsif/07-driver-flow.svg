<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 826" width="1340" height="826" font-family="'Segoe UI','DejaVu Sans',Helvetica,Arial,sans-serif" role="img"><defs><marker id="aD6336C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D6336C"/></marker></defs><defs><marker id="a6B7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker></defs><rect x="0" y="0" width="1340" height="826" rx="14" fill="#FFFFFF"/><text x="24" y="34" font-size="18" font-weight="700" fill="#111827" text-anchor="start">Драйвер UHSIF: порядок вызовов и обработчик прерывания</text><text x="24" y="56" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start">Одинаково для libUHSIF.a и fw/uhsif (сверено в spike обращение в обращение).</text><rect x="24" y="96" width="420" height="74" rx="10" fill="#F4F4F5" stroke="#71717A" stroke-width="1.6"/><text x="36" y="119" font-size="14" font-weight="700" fill="#111827" text-anchor="start">UHSIF_GPIO_Init(mode, port_rm, clk_rm, div, width)</text><text x="36" y="138" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">выводы, AFIO_PCFR1; у ведущего — UHSIFDIV</text><rect x="24" y="192" width="420" height="74" rx="10" fill="#E8F0FF" stroke="#1C64F2" stroke-width="1.6"/><text x="36" y="215" font-size="14" font-weight="700" fill="#111827" text-anchor="start">UHSIF_Cfg()</text><text x="36" y="234" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">76 слов настройки + полярности и ширина,</text><text x="36" y="251" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">+0x024, микрокод, таблица переходов</text><path d="M234.0 170 L234.0 192" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><rect x="24" y="288" width="420" height="74" rx="10" fill="#E8F0FF" stroke="#1C64F2" stroke-width="1.6"/><text x="36" y="311" font-size="14" font-weight="700" fill="#111827" text-anchor="start">UHSIF_Line_Cfg(line, dir, count, pbuf, wm) × N</text><text x="36" y="330" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">дескрипторы, регистры сокетов,</text><text x="36" y="347" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">регистр канала</text><path d="M234.0 266 L234.0 288" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><rect x="24" y="384" width="420" height="74" rx="10" fill="#E6F6EC" stroke="#13924F" stroke-width="1.6"/><text x="36" y="407" font-size="14" font-weight="700" fill="#111827" text-anchor="start">UHSIF_Start(ENABLE)</text><text x="36" y="426" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">+0x118/+0x11C, пуск CTRL, сокет 0 |= 0x1C1,</text><text x="36" y="443" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">IRQ 145</text><path d="M234.0 362 L234.0 384" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><rect x="24" y="500" width="420" height="74" rx="10" fill="#E6F6EC" stroke="#13924F" stroke-width="1.6"/><text x="36" y="523" font-size="14" font-weight="700" fill="#111827" text-anchor="start">UHSIF_Trans_Cfg(line, buf, n)</text><text x="36" y="542" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">взвести или перевзвести буфер</text><text x="36" y="559" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">см. «Перевзвод сокета»</text><path d="M234.0 458 L234.0 500" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><rect x="24" y="620" width="420" height="60" rx="10" fill="#F4F4F5" stroke="#71717A" stroke-width="1.6"/><text x="36" y="643" font-size="14" font-weight="700" fill="#111827" text-anchor="start">UHSIF_Start(DISABLE)</text><text x="36" y="662" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">IRQ выкл, сброс блока, такт выкл</text><path d="M444 530 L474 530 L474 160 L540 160" fill="none" stroke="#D6336C" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#aD6336C)"/><text x="480" y="300" font-size="12" font-weight="600" fill="#D6336C" text-anchor="start">прерывание</text><path d="M940 724 L940 760 L494 760 L494 560 L444 560" fill="none" stroke="#D6336C" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#aD6336C)"/><text x="500" y="750" font-size="12" font-weight="600" fill="#D6336C" text-anchor="start">из колбэка</text><rect x="524" y="100" width="800" height="640" rx="14" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6 5"/><text x="538" y="120" font-size="13" font-weight="700" fill="#4B5563" text-anchor="start">UHSIF_IRQHandler</text><rect x="540" y="130" width="330" height="60" rx="10" fill="#F4F4F5" stroke="#71717A" stroke-width="1.6"/><text x="552" y="153" font-size="14" font-weight="700" fill="#111827" text-anchor="start">f = UHSIF+0x014</text><text x="552" y="172" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">канал n — первый бит из 11…14</text><rect x="940" y="130" width="360" height="60" rx="10" fill="#F4F4F5" stroke="#71717A" stroke-width="1.6"/><text x="952" y="153" font-size="14" font-weight="700" fill="#111827" text-anchor="start">флагов нет</text><text x="952" y="172" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">всё равно обслуживается канал 0, сокет 0, как IN</text><path d="M870 160 L940 160" fill="none" stroke="#6B7280" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a6B7280)"/><rect x="540" y="216" width="330" height="60" rx="10" fill="#F4F4F5" stroke="#71717A" stroke-width="1.6"/><text x="552" y="239" font-size="14" font-weight="700" fill="#111827" text-anchor="start">s = LINE(n)[4:0], st = S(s)+0x10</text><text x="552" y="258" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">текущий сокет и его флаги</text><path d="M705 190 L705 216" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><path d="M705 292.0 L820.0 330 L705 368.0 L590.0 330Z" fill="#FFF8DB" stroke="#E09400" stroke-width="1.6"/><text x="705" y="328" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">st &amp; 0x01 ?</text><path d="M705 276 L705 292" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><rect x="940" y="300" width="360" height="64" rx="10" fill="#E8F0FF" stroke="#1C64F2" stroke-width="1.6"/><text x="952" y="323" font-size="14" font-weight="700" fill="#111827" text-anchor="start">LINE(n) = вкл | dir | wm | !dir | 0x400 | (s + 4)</text><text x="952" y="342" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">канал переходит к следующему буферу</text><path d="M820 330 L940 330" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><text x="880" y="322" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">нет</text><text x="715" y="386" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">да: остаться на этом буфере</text><path d="M705 405.0 L820.0 440 L705 475.0 L590.0 440Z" fill="#FFF8DB" stroke="#E09400" stroke-width="1.6"/><text x="705" y="438" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">st &amp; 0x80 ?</text><path d="M705 368 L705 405" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><path d="M1120 364 L1120 392 L705 392" fill="none" stroke="#6B7280" stroke-width="1.5"/><rect x="940" y="416" width="170" height="48" rx="10" fill="#FDE8EC" stroke="#D6336C" stroke-width="1.6"/><text x="1025.0" y="445.0" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">сбросить 0x80</text><path d="M820 440 L940 440" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><text x="880" y="432" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">да</text><path d="M705 495.0 L820.0 530 L705 565.0 L590.0 530Z" fill="#FFF8DB" stroke="#E09400" stroke-width="1.6"/><text x="705" y="528" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">st &amp; 0x40 ?</text><path d="M705 475 L705 495" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><text x="720" y="490" font-size="12" font-weight="600" fill="#6B7280" text-anchor="start">нет</text><rect x="940" y="506" width="360" height="48" rx="10" fill="#FDE8EC" stroke="#D6336C" stroke-width="1.6"/><text x="1120.0" y="535.0" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">сбросить 0x40 (и 0x01, если стоял)</text><path d="M820 530 L940 530" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><text x="880" y="522" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">да</text><path d="M705 581.0 L820.0 616 L705 651.0 L590.0 616Z" fill="#FFF8DB" stroke="#E09400" stroke-width="1.6"/><text x="705" y="614" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">st &amp; 0x100 ?</text><path d="M705 565 L705 581" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><text x="720" y="578" font-size="12" font-weight="600" fill="#6B7280" text-anchor="start">нет</text><rect x="940" y="592" width="170" height="48" rx="10" fill="#FDE8EC" stroke="#D6336C" stroke-width="1.6"/><text x="1025.0" y="621.0" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">сбросить 0x100</text><path d="M820 616 L940 616" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><text x="880" y="608" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">да</text><rect x="940" y="660" width="360" height="64" rx="10" fill="#E6F6EC" stroke="#13924F" stroke-width="1.6"/><text x="952" y="683" font-size="14" font-weight="700" fill="#111827" text-anchor="start">dir = IN: LineN_IN_Callback(S(s)+0x08)</text><text x="952" y="702" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">dir = OUT: LineN_OUT_Callback()</text><path d="M705 651 L705 692 L940 692" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><path d="M1110 440 L1320 440" fill="none" stroke="#6B7280" stroke-width="1.5"/><path d="M1300 530 L1320 530" fill="none" stroke="#6B7280" stroke-width="1.5"/><path d="M1110 616 L1320 616" fill="none" stroke="#6B7280" stroke-width="1.5"/><path d="M1320 440 L1320 692" fill="none" stroke="#6B7280" stroke-width="1.5"/><path d="M1320 692 L1300 692" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><text x="24" y="812" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">Флаги разбираются по приоритету 0x80 → 0x40 → 0x100, за прерывание сбрасывается один.</text></svg>
