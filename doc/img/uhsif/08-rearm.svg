<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 560" width="1420" height="560" font-family="'Segoe UI','DejaVu Sans',Helvetica,Arial,sans-serif" role="img"><defs><marker id="a4B5563" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4B5563"/></marker></defs><defs><marker id="a6B7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker></defs><rect x="0" y="0" width="1420" height="560" rx="14" fill="#FFFFFF"/><text x="24" y="34" font-size="18" font-weight="700" fill="#111827" text-anchor="start">Перевзвод сокета: первый круг по буферам и все следующие</text><text x="24" y="56" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start">UHSIF_Trans_Cfg, восстановлено по libUHSIF.a. S = регистры сокета, dscr = его дескриптор, size = 16 КБ.</text><text x="24" y="136" font-size="14" font-weight="700" fill="#111827" text-anchor="start">OUT (МК → ПЛИС)</text><rect x="200" y="96" width="270" height="86" rx="10" fill="#F4F4F5" stroke="#71717A" stroke-width="1.6"/><text x="212" y="119" font-size="14" font-weight="700" fill="#111827" text-anchor="start">UHSIF_Line_Cfg</text><text x="212" y="138" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">S+0x0C |= 0x0500_0000</text><text x="212" y="155" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">dscr.len = size&lt;&lt;16 | size</text><rect x="500" y="96" width="270" height="86" rx="10" fill="#FDE8EC" stroke="#D6336C" stroke-width="1.6"/><text x="512" y="119" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Trans_Cfg, первый круг</text><text x="512" y="138" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">count вызовов; n &lt; size:</text><text x="512" y="155" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">dscr.len = n&lt;&lt;16 | size; S+0x0C бит 31 = 1</text><path d="M470 139 L500 139" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><rect x="800" y="96" width="270" height="86" rx="10" fill="#F4F4F5" stroke="#71717A" stroke-width="1.6"/><text x="812" y="119" font-size="14" font-weight="700" fill="#111827" text-anchor="start">передача, прерывание</text><text x="812" y="138" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">LineN_OUT_Callback()</text><path d="M770 139 L800 139" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><rect x="1100" y="96" width="270" height="86" rx="10" fill="#FDE8EC" stroke="#D6336C" stroke-width="1.6"/><text x="1112" y="119" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Trans_Cfg, дальше</text><text x="1112" y="138" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">S+0x08 = 0; dscr.len = n&lt;&lt;16 | size</text><text x="1112" y="155" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">S+0x0C бит 30: 1 → 0</text><path d="M1070 139 L1100 139" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><text x="24" y="266" font-size="14" font-weight="700" fill="#111827" text-anchor="start">IN (ПЛИС → МК)</text><rect x="200" y="226" width="270" height="86" rx="10" fill="#F4F4F5" stroke="#71717A" stroke-width="1.6"/><text x="212" y="249" font-size="14" font-weight="700" fill="#111827" text-anchor="start">UHSIF_Line_Cfg + Start</text><text x="212" y="268" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">S+0x0C |= 0x8C00_0000</text><text x="212" y="285" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">сокет 0: S+0x10 |= 0x1C1</text><rect x="500" y="226" width="270" height="86" rx="10" fill="#F4F4F5" stroke="#71717A" stroke-width="1.6"/><text x="512" y="249" font-size="14" font-weight="700" fill="#111827" text-anchor="start">приём, прерывание</text><text x="512" y="268" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">LineN_IN_Callback(S+0x08)</text><text x="512" y="285" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">S+0x08 — принятая длина</text><path d="M470 269 L500 269" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><rect x="800" y="226" width="270" height="86" rx="10" fill="#E6F6EC" stroke="#13924F" stroke-width="1.6"/><text x="812" y="249" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Trans_Cfg(line, buf, 0)</text><text x="812" y="268" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">S+0x08 &lt; size: dscr.len = size&lt;&lt;16|size</text><text x="812" y="285" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">адрес dscr — из S+0x00</text><path d="M770 269 L800 269" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><rect x="1100" y="226" width="270" height="86" rx="10" fill="#E6F6EC" stroke="#13924F" stroke-width="1.6"/><text x="1112" y="249" font-size="14" font-weight="700" fill="#111827" text-anchor="start">затем</text><text x="1112" y="268" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">S+0x08 = 0</text><text x="1112" y="285" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">S+0x0C бит 30: 1 → 0</text><path d="M1070 269 L1100 269" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><path d="M1235 182 L1235 200 L935 200 L935 182" fill="none" stroke="#4B5563" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a4B5563)"/><text x="1085" y="214" font-size="12" font-weight="600" fill="#4B5563" text-anchor="middle">по кругу</text><rect x="200" y="372" width="600" height="98" rx="10" fill="#FDE8EC" stroke="#D6336C" stroke-width="2.5"/><text x="212" y="395" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Ловушка: n &gt; 16 КБ</text><text x="212" y="414" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">в первом круге длина молча остаётся прежней, дальше n&lt;&lt;16 переполняет поле;</text><text x="212" y="431" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">длина ровно 16 КБ в первом круге работает только потому, что Line_Cfg</text><text x="212" y="448" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">уже записал 0x4000. fw/uhsif возвращает 0xA9.</text><rect x="830" y="372" width="540" height="98" rx="10" fill="#F4F4F5" stroke="#71717A" stroke-width="1.6"/><text x="842" y="395" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Бит 31 и бит 30 в S+0x0C</text><text x="842" y="414" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">бит 31 ставится один раз, при первом взводе;</text><text x="842" y="431" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">дальше перевзвод — импульс бита 30 (записать 1, затем 0).</text><text x="842" y="448" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">Названия по поведению, на железе не проверено.</text><text x="24" y="510" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">Для IN первый буфер взводит UHSIF_Start; дальше приложение вызывает Trans_Cfg на каждый освобождённый буфер.</text></svg>
