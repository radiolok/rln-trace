<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 650" width="1190" height="650" font-family="'Segoe UI','DejaVu Sans',Helvetica,Arial,sans-serif" role="img"><title>Стенд прозвонки SLogic16U3</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker></defs><rect x="0" y="0" width="1190" height="650" rx="14" fill="#FFFFFF"/><text x="24" y="34" font-size="18" font-weight="700" fill="#111827" text-anchor="start">Стенд прозвонки SLogic16U3: источник на STM32, результат через JTAG</text><text x="24" y="56" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start">Образ jprobe грузится только в SRAM ПЛИС; флеш не трогается, прибор возвращается передёргиванием питания.</text><rect x="420" y="80" width="340" height="92" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.6"/><text x="432" y="103" font-size="14" font-weight="700" fill="#111827" text-anchor="start">ПК: Windows + WSL2</text><text x="432" y="123" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">Gowin EDA 1.9.12 — сборка (gw_sh.exe из WSL)</text><text x="432" y="140" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">OpenOCD, openFPGALoader — OSS CAD Suite</text><text x="432" y="157" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">usbipd-win: USB-устройства → WSL</text><rect x="24" y="214" width="262" height="276" rx="10" fill="#FFF1E6" stroke="#E8590C" stroke-width="1.6"/><text x="36" y="237" font-size="14" font-weight="700" fill="#111827" text-anchor="start">STM32F4-Discovery</text><text x="36" y="257" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">источник: счётчик n, шаг 2 мкс (HSI)</text><text x="36" y="274" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">бит k: 500 кГц / 2^k переключений/с</text><rect x="36" y="285" width="238" height="20" rx="4" fill="#FFFFFF" stroke="#F4B183" stroke-width="1"/><text x="44" y="300" font-size="12" font-weight="600" fill="#111827" text-anchor="start">PD0 … PD7</text><text x="150" y="300" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">→</text><text x="170" y="300" font-size="12" font-weight="400" fill="#111827" text-anchor="start">CH0 … CH7</text><rect x="36" y="307" width="238" height="20" rx="4" fill="#FFFFFF" stroke="#F4B183" stroke-width="1"/><text x="44" y="322" font-size="12" font-weight="600" fill="#111827" text-anchor="start">PE8, PE9</text><text x="150" y="322" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">→</text><text x="170" y="322" font-size="12" font-weight="400" fill="#111827" text-anchor="start">CH8, CH9</text><rect x="36" y="329" width="238" height="20" rx="4" fill="#FFFFFF" stroke="#F4B183" stroke-width="1"/><text x="44" y="344" font-size="12" font-weight="600" fill="#111827" text-anchor="start">PE2 … PE7</text><text x="150" y="344" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">→</text><text x="170" y="344" font-size="12" font-weight="400" fill="#111827" text-anchor="start">CH10 … CH15</text><rect x="36" y="351" width="238" height="20" rx="4" fill="#FFFFFF" stroke="#F4B183" stroke-width="1"/><text x="44" y="366" font-size="12" font-weight="600" fill="#111827" text-anchor="start">PE10, PE11</text><text x="150" y="366" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">→</text><text x="170" y="366" font-size="12" font-weight="400" fill="#111827" text-anchor="start">CK0, CK1</text><rect x="36" y="373" width="238" height="20" rx="4" fill="#FFFFFF" stroke="#F4B183" stroke-width="1"/><text x="44" y="388" font-size="12" font-weight="600" fill="#111827" text-anchor="start">GND</text><text x="150" y="388" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">→</text><text x="170" y="388" font-size="12" font-weight="400" fill="#111827" text-anchor="start">GND</text><text x="36" y="430" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">PE0/PE1 держит акселерометр,</text><text x="36" y="446" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">PH0/PH1 — кварц HSE: не брать</text><text x="36" y="472" font-size="12" font-weight="600" fill="#111827" text-anchor="start">ST-LINK/V2 (SWD) — на борту</text><rect x="330" y="214" width="510" height="360" rx="14" fill="none" stroke="#1C64F2" stroke-width="1.5" stroke-dasharray="6 5"/><text x="344" y="236" font-size="14" font-weight="700" fill="#1C64F2" text-anchor="start">Sipeed SLogic16U3</text><rect x="346" y="252" width="112" height="206" rx="10" fill="#FFF8DB" stroke="#E09400" stroke-width="1.6"/><text x="358" y="275" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Гребёнка</text><text x="358" y="295" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">CH0 … CH15</text><text x="358" y="312" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">CK0, CK1</text><text x="358" y="329" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">GND</text><text x="358" y="346" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start"></text><text x="358" y="363" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">диапазон</text><text x="358" y="380" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">по умолчанию</text><text x="358" y="397" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">до 10 В</text><rect x="476" y="252" width="156" height="206" rx="10" fill="#FFF8DB" stroke="#E09400" stroke-width="1.6"/><text x="488" y="275" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Делители</text><text x="488" y="295" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">резисторные сборки</text><text x="488" y="312" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">+ конденсатор</text><text x="488" y="329" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start"></text><text x="488" y="346" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">k ≈ 0,47:</text><text x="488" y="363" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">3,0 В → 1,42 В</text><text x="488" y="380" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start"></text><text x="488" y="397" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">на шарике ПЛИС</text><text x="488" y="414" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">ниже LVCMOS33</text><rect x="650" y="252" width="174" height="206" rx="10" fill="#E8F0FF" stroke="#1C64F2" stroke-width="2.5"/><text x="662" y="275" font-size="14" font-weight="700" fill="#111827" text-anchor="start">GW5AT-15 MG132</text><text x="662" y="295" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">банк 1, VCCIO 3,3 В</text><text x="662" y="312" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">16 каналов = 8 пар:</text><text x="662" y="329" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">IOB12 … IOB24, IOB41</text><text x="662" y="346" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start"></text><text x="662" y="363" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">входы LVCMOS15UD33,</text><text x="662" y="380" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">порог ~0,75 В,</text><text x="662" y="397" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">без подтяжки</text><rect x="650" y="480" width="174" height="78" rx="10" fill="#E6F6EC" stroke="#13924F" stroke-width="1.6"/><text x="662" y="503" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Разъём отладки</text><text x="662" y="523" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">TCK TDI TDO TMS</text><text x="662" y="540" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">RXD TXD, GND; 5V — нет</text><rect x="346" y="480" width="286" height="78" rx="10" fill="#E2F7F8" stroke="#0B8EA0" stroke-width="1.6"/><text x="358" y="503" font-size="14" font-weight="700" fill="#111827" text-anchor="start">USB-C: USB3 / USB2</text><text x="358" y="523" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">питание прибора, заводской</text><text x="358" y="540" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">анализатор; DFU — кнопка MODE</text><rect x="886" y="214" width="280" height="182" rx="10" fill="#E8F0FF" stroke="#1C64F2" stroke-width="1.6" stroke-dasharray="5 4"/><text x="898" y="237" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Образ jprobe (SRAM)</text><text x="898" y="257" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">36 кандидатов — только входы</text><text x="898" y="274" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">окно 2^26 тактов OSCB ≈ 2,24 с</text><text x="898" y="291" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">фронты: сырые и после фильтра</text><text x="898" y="308" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">кадр → ER1 GW_JTAG (IR 0x42)</text><text x="898" y="325" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">константа → ER2 (IR 0x43)</text><text x="898" y="342" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start"></text><text x="898" y="359" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">чтение — jprobe.py (OpenOCD)</text><text x="898" y="376" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">источник — bench.py (tcl 6667)</text><rect x="886" y="446" width="280" height="112" rx="10" fill="#F3EBFF" stroke="#7C3AED" stroke-width="1.6"/><text x="898" y="469" font-size="14" font-weight="700" fill="#111827" text-anchor="start">FT2232H</text><text x="898" y="489" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">канал A — JTAG ПЛИС:</text><text x="898" y="506" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">ADBUS0 TCK, 1 TDI, 2 TDO, 3 TMS</text><text x="898" y="523" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">канал B — UART (не нужен)</text><text x="898" y="540" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">GND общий</text><path d="M286 352 L346 352" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a)"/><text x="316" y="344" font-size="11" font-weight="600" fill="#374151" text-anchor="middle">16 + 2</text><path d="M458 355 L476 355" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a)"/><path d="M632 355 L650 355" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a)"/><path d="M737 458 L737 480" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#a)"/><path d="M886 519 L824 519" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#a)"/><text x="855" y="511" font-size="11" font-weight="600" fill="#374151" text-anchor="middle">JTAG</text><path d="M1026 446 L1026 396" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#a)"/><path d="M155 214 L155 126 L420 126" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a)"/><text x="168" y="118" font-size="11" font-weight="600" fill="#374151" text-anchor="start">USB: ST-LINK</text><path d="M346 519 L308 519 L308 152 L420 152" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a)"/><text x="316" y="144" font-size="11" font-weight="600" fill="#374151" text-anchor="start">USB</text><path d="M1166 446 L1176 446 L1176 126 L760 126" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a)"/><text x="1160" y="118" font-size="11" font-weight="600" fill="#374151" text-anchor="end">USB: FT2232H</text><text x="24" y="612" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">Порядок: прошить источник → собрать jprobe → openFPGALoader -c ft2232 -m jprobe.fs → jprobe.py --er2 → jprobe.py, bench.py gate | static.</text><text x="24" y="632" font-size="12" font-weight="600" fill="#111827" text-anchor="start">Итог: CH0 J14, CH1 J13, CH2–CH15 = N14 P14 N13 P13 N12 P12 N11 P11 N10 P10 N9 P9 N8 P8; CK0/CK1 на выводах ПЛИС не найдены.</text></svg>
