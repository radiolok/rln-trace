# STM32F4-Discovery over JTAG through the Tang Nano 9K (gw/boards/tangnano9k/top_jtag.sv):
# OpenOCD remote_bitbang -> sw/rbb/rbb_bridge.py -> BL702 UART -> rbb_jtag.
# Start the bridge first: sw/rbb/rbb_bridge.py /dev/ttyUSBx

adapter driver remote_bitbang
remote_bitbang host 127.0.0.1
remote_bitbang port 3335
transport select jtag

source [find target/stm32f4x.cfg]

# nTRST and nSRST are wired; the target firmware may run HCLK at kHz, so attach under reset
reset_config trst_and_srst srst_nogate connect_assert_srst

# stm32f4x.cfg changes "adapter speed" around reset, remote_bitbang has no speed:
# same events without it. TCK is set by the UART rate (27 MHz / DIV of top_jtag).
$_TARGETNAME configure -event reset-start {}
$_TARGETNAME configure -event reset-init {
	mww 0x40023804 0x08012008   ;# RCC_PLLCFGR 16 MHz /8 (M) * 128 (N) /4 (P) = 64 MHz
	mww 0x40023C00 0x00000102   ;# FLASH_ACR = PRFTBE | 2 (latency)
	mmw 0x40023800 0x01000000 0 ;# RCC_CR |= PLLON
	sleep 10
	mmw 0x40023808 0x00001000 0 ;# RCC_CFGR |= PPRE1_DIV2
	mmw 0x40023808 0x00000002 0 ;# RCC_CFGR |= SW_PLL
}
