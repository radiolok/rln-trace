<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" width="1080" height="600" font-family="'Segoe UI','DejaVu Sans',Helvetica,Arial,sans-serif" role="img"><defs><marker id="a13924F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#13924F"/></marker></defs><defs><marker id="a0B8EA0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0B8EA0"/></marker></defs><defs><marker id="a6B7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker></defs><rect x="0" y="0" width="1080" height="600" rx="14" fill="#FFFFFF"/><text x="24" y="34" font-size="18" font-weight="700" fill="#111827" text-anchor="start">Входной каскад: защита, затем транслятор с питанием стороны цели от VREF</text><text x="24" y="56" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start">По умолчанию трансляторы выключены (OE = 1); прошивка включает их, только когда VREF в окне 1,2–3,6 В.</text><rect x="24" y="120" width="150" height="220" rx="10" fill="#FFF1E6" stroke="#E8590C" stroke-width="1.6"/><text x="36" y="143" font-size="14" font-weight="700" fill="#111827" text-anchor="start">MIPI20</text><text x="36" y="162" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">1  VREF</text><text x="36" y="179" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">2  TMS / SWDIO</text><text x="36" y="196" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">4  TCK / SWCLK</text><text x="36" y="213" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">6  TDO / SWO</text><text x="36" y="230" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">8  TDI</text><text x="36" y="247" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">10 nRESET</text><text x="36" y="264" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">12 TRC_CLK</text><text x="36" y="281" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">14–20 TRC_DATA[0..3]</text><text x="36" y="298" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">11/13 GND / TgtPwr</text><rect x="214" y="120" width="150" height="330" rx="10" fill="#FFF8DB" stroke="#E09400" stroke-width="1.6"/><text x="226" y="143" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Защита</text><text x="226" y="162" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">TPD4E02B04 ×3</text><text x="226" y="179" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">(~0,5 пФ на линию)</text><text x="226" y="196" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start"></text><text x="226" y="213" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">затем 33 Ом</text><text x="226" y="230" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">последовательно</text><text x="226" y="247" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">(подбор на макете)</text><rect x="404" y="120" width="230" height="110" rx="10" fill="#FFF8DB" stroke="#E09400" stroke-width="1.6"/><text x="416" y="143" font-size="14" font-weight="700" fill="#111827" text-anchor="start">SN74AVC8T245 (приём)</text><text x="416" y="162" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">DIR = 0: цель → ПЛИС</text><text x="416" y="179" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">TRC_CLK, TRC_DATA[0..3]</text><text x="416" y="196" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">TDO / SWO, контроль nRESET</text><rect x="404" y="246" width="230" height="92" rx="10" fill="#FFF8DB" stroke="#E09400" stroke-width="1.6"/><text x="416" y="269" font-size="14" font-weight="700" fill="#111827" text-anchor="start">SN74AVC4T245</text><text x="416" y="288" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">гр. 1: SWDIO, DIR от ПЛИС</text><text x="416" y="305" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">гр. 2: SWCLK, TDI → цель</text><rect x="404" y="354" width="230" height="96" rx="10" fill="#FFF8DB" stroke="#E09400" stroke-width="1.6"/><text x="416" y="377" font-size="14" font-weight="700" fill="#111827" text-anchor="start">nRESET: 2N7002</text><text x="416" y="396" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">открытый сток,</text><text x="416" y="413" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">читается через AVC8T245</text><rect x="674" y="120" width="170" height="330" rx="10" fill="#E8F0FF" stroke="#1C64F2" stroke-width="1.6"/><text x="686" y="143" font-size="14" font-weight="700" fill="#111827" text-anchor="start">ПЛИС</text><text x="686" y="162" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">банк 6: трасса</text><text x="686" y="179" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">  TRC_CLK на GCLKT_6</text><text x="686" y="196" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">  IDDR + IODELAY</text><text x="686" y="213" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start"></text><text x="686" y="230" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">банк 0: отладка</text><text x="686" y="247" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">  SWDIO, DIR</text><text x="686" y="264" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">  SWCLK, TDI</text><text x="686" y="281" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">  NRST_DRV</text><text x="686" y="298" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start"></text><text x="686" y="315" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">OE трансляторов</text><path d="M174 230 L214 230" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)" marker-start="url(#a6B7280)"/><path d="M364 175 L404 175" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><path d="M364 292 L404 292" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)" marker-start="url(#a6B7280)"/><path d="M364 402 L404 402" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)" marker-start="url(#a6B7280)"/><path d="M634 175 L674 175" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><path d="M634 292 L674 292" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)" marker-start="url(#a6B7280)"/><path d="M674 402 L634 402" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><rect x="214" y="488" width="200" height="84" rx="10" fill="#E2F7F8" stroke="#0B8EA0" stroke-width="1.6"/><text x="226" y="511" font-size="14" font-weight="700" fill="#111827" text-anchor="start">VREF → VREF_F</text><text x="226" y="530" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">10 Ом + 1 мкФ</text><text x="226" y="547" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">питает VCCB трансляторов</text><rect x="454" y="488" width="180" height="84" rx="10" fill="#E2F7F8" stroke="#0B8EA0" stroke-width="1.6"/><text x="466" y="511" font-size="14" font-weight="700" fill="#111827" text-anchor="start">ADS1115 (I²C)</text><text x="466" y="530" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">VREF/2, TgtPwr/2,</text><text x="466" y="547" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">5V/2, 3V3/2</text><path d="M99 340 L99 530 L214 530" fill="none" stroke="#0B8EA0" stroke-width="1.8" marker-end="url(#a0B8EA0)"/><text x="106" y="520" font-size="12" font-weight="600" fill="#0B8EA0" text-anchor="start">VREF</text><path d="M414 530 L454 530" fill="none" stroke="#0B8EA0" stroke-width="1.8" marker-end="url(#a0B8EA0)"/><rect x="884" y="120" width="172" height="190" rx="10" fill="#E6F6EC" stroke="#13924F" stroke-width="1.6"/><text x="896" y="143" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Питание цели</text><text x="896" y="162" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">+5 В → AP2161</text><text x="896" y="179" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">  (ограничение тока)</text><text x="896" y="196" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">шунт 0,1 Ом</text><text x="896" y="213" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">  + INA219</text><text x="896" y="230" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">JP1: контакты 11/13</text><text x="896" y="247" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">  GND или TgtPwr</text><text x="896" y="264" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">10 пФ у контактов</text><path d="M970 120 L970 92 L60 92 L60 120" fill="none" stroke="#13924F" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a13924F)"/><text x="520" y="108" font-size="12" font-weight="600" fill="#13924F" text-anchor="middle">TgtPwr → контакты 11/13</text><rect x="674" y="529" width="14" height="14" rx="3" fill="#FFF1E6" stroke="#E8590C" stroke-width="1.6"/><text x="694" y="541" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">разъём</text><rect x="752.4" y="529" width="14" height="14" rx="3" fill="#FFF8DB" stroke="#E09400" stroke-width="1.6"/><text x="772.4" y="541" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">защита и уровни</text><rect x="897.4" y="529" width="14" height="14" rx="3" fill="#E8F0FF" stroke="#1C64F2" stroke-width="1.6"/><text x="917.4" y="541" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">ПЛИС</text><rect x="674" y="555" width="14" height="14" rx="3" fill="#E2F7F8" stroke="#0B8EA0" stroke-width="1.6"/><text x="694" y="567" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">VREF и измерения</text><rect x="826.4" y="555" width="14" height="14" rx="3" fill="#E6F6EC" stroke="#13924F" stroke-width="1.6"/><text x="846.4" y="567" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">питание цели</text></svg>
