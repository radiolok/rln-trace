<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 530" width="1080" height="530" font-family="'Segoe UI','DejaVu Sans',Helvetica,Arial,sans-serif" role="img"><defs><marker id="aE8590C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E8590C"/></marker></defs><defs><marker id="a0B8EA0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0B8EA0"/></marker></defs><defs><marker id="a6B7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker></defs><rect x="0" y="0" width="1080" height="530" rx="14" fill="#FFFFFF"/><text x="24" y="34" font-size="18" font-weight="700" fill="#111827" text-anchor="start">Гейтвар: трасса, события и команды сходятся в мосте HSPI</text><text x="24" y="56" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start">Цвет блока — домен тактирования. Переходы между доменами — асинхронные FIFO.</text><rect x="24" y="90" width="220" height="92" rx="10" fill="#FFF1E6" stroke="#E8590C" stroke-width="1.6"/><text x="36" y="113" font-size="14" font-weight="700" fill="#111827" text-anchor="start">IDDR + IODELAY</text><text x="36" y="132" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">2 ниббла за такт TRC_CLK</text><text x="36" y="149" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">задержка на каждую линию</text><rect x="290" y="90" width="220" height="92" rx="10" fill="#FFF1E6" stroke="#E8590C" stroke-width="1.6"/><text x="302" y="113" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Сборка слов</text><text x="302" y="132" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">32 бита</text><text x="302" y="149" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">async FIFO: TRC_CLK → sys</text><rect x="556" y="90" width="220" height="92" rx="10" fill="#E8F0FF" stroke="#1C64F2" stroke-width="2.5"/><text x="568" y="113" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Деформатор TPIU</text><text x="568" y="132" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">синхронизация, кадры 16 Б</text><text x="568" y="149" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">выброс idle, номер кадра</text><rect x="822" y="90" width="220" height="92" rx="10" fill="#E8F0FF" stroke="#1C64F2" stroke-width="1.6"/><text x="834" y="113" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Пакетизатор</text><text x="834" y="132" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">ответы &gt; события &gt; трасса</text><text x="834" y="149" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">заголовок 4 Б + данные</text><rect x="24" y="250" width="220" height="92" rx="10" fill="#E8F0FF" stroke="#1C64F2" stroke-width="1.6"/><text x="36" y="273" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Самотест</text><text x="36" y="292" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">PRBS и синтетические</text><text x="36" y="309" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">кадры TPIU</text><rect x="290" y="250" width="220" height="92" rx="10" fill="#E2F7F8" stroke="#0B8EA0" stroke-width="1.6"/><text x="302" y="273" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Счётчик 64 бита</text><text x="302" y="292" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">PLL 200–250 МГц</text><text x="302" y="309" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">опора: SMA1 или генератор</text><rect x="556" y="250" width="220" height="92" rx="10" fill="#E2F7F8" stroke="#0B8EA0" stroke-width="1.6"/><text x="568" y="273" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Захват событий</text><text x="568" y="292" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">фронты SMA1/SMA2, PPS</text><text x="568" y="309" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">служебные метки кадров</text><rect x="822" y="250" width="220" height="92" rx="10" fill="#E8F0FF" stroke="#1C64F2" stroke-width="1.6"/><text x="834" y="273" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Кольцо в SDRAM</text><text x="834" y="292" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">64 Мбит в корпусе ПЛИС</text><text x="834" y="309" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">~100 мс на пике 84 МБ/с</text><rect x="290" y="380" width="220" height="92" rx="10" fill="#E8F0FF" stroke="#1C64F2" stroke-width="1.6"/><text x="302" y="403" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Движок SWD/JTAG</text><text x="302" y="422" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">целые транзакции</text><text x="302" y="439" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">ACK, WAIT, чётность</text><rect x="556" y="380" width="220" height="92" rx="10" fill="#E8F0FF" stroke="#1C64F2" stroke-width="1.6"/><text x="568" y="403" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Регистры CSR</text><text x="568" y="422" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">настройка всех блоков</text><text x="568" y="439" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">счётчики ошибок</text><rect x="822" y="380" width="220" height="92" rx="10" fill="#E6F6EC" stroke="#13924F" stroke-width="2.5"/><text x="834" y="403" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Мост HSPI → CH569</text><text x="834" y="422" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">16 бит (макет: 8 бит)</text><text x="834" y="439" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">трасса, события, команды</text><path d="M244 136.0 L290 136.0" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><path d="M510 136.0 L556 136.0" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><path d="M776 136.0 L822 136.0" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><path d="M134.0 250 L134.0 204 L596 204 L596 182" fill="none" stroke="#6B7280" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a6B7280)"/><text x="400.0" y="198" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">вместо входа</text><path d="M510 296.0 L556 296.0" fill="none" stroke="#0B8EA0" stroke-width="1.8" marker-end="url(#a0B8EA0)"/><path d="M756 250 L756 208 L852 208 L852 182" fill="none" stroke="#0B8EA0" stroke-width="1.8" marker-end="url(#a0B8EA0)"/><text x="842" y="202" font-size="12" font-weight="600" fill="#0B8EA0" text-anchor="end">события</text><path d="M686 182 L686 250" fill="none" stroke="#E8590C" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#aE8590C)"/><text x="680" y="228" font-size="12" font-weight="600" fill="#E8590C" text-anchor="end">frameStrobe</text><path d="M972 182 L972 250" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><text x="978" y="228" font-size="12" font-weight="600" fill="#6B7280" text-anchor="start">трасса</text><path d="M972.0 342 L972.0 380" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><path d="M822 426.0 L776 426.0" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)" marker-start="url(#a6B7280)"/><path d="M556 426.0 L510 426.0" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><path d="M290 426.0 L244 426.0" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><rect x="24" y="403" width="220" height="46" rx="10" fill="#FFF1E6" stroke="#E8590C" stroke-width="1.6"/><text x="134.0" y="431.0" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">MIPI20 (трансляторы)</text><rect x="24" y="499" width="14" height="14" rx="3" fill="#FFF1E6" stroke="#E8590C" stroke-width="1.6"/><text x="44" y="511" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">домен TRC_CLK (такт цели)</text><rect x="243.0" y="499" width="14" height="14" rx="3" fill="#E8F0FF" stroke="#1C64F2" stroke-width="1.6"/><text x="263.0" y="511" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">домен sys</text><rect x="343.6" y="499" width="14" height="14" rx="3" fill="#E2F7F8" stroke="#0B8EA0" stroke-width="1.6"/><text x="363.6" y="511" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">домен ts (метки времени)</text><rect x="555.2" y="499" width="14" height="14" rx="3" fill="#E6F6EC" stroke="#13924F" stroke-width="1.6"/><text x="575.2" y="511" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">выход к CH569</text></svg>
