<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" font-family="'Segoe UI','DejaVu Sans',Helvetica,Arial,sans-serif" role="img"><rect x="0" y="0" width="1000" height="270" rx="14" fill="#FFFFFF"/><text x="24" y="34" font-size="18" font-weight="700" fill="#111827" text-anchor="start">Событие привязано к номеру кадра трассы, а не только ко времени</text><text x="24" y="56" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start">Номер кадра режет поток на интервалы PPS–PPS с точностью до 16 байт; служебные метки пересчитывают время внутри.</text><rect x="200" y="100" width="96" height="44" rx="10" fill="#E8F0FF" stroke="#1C64F2" stroke-width="1.6"/><text x="248.0" y="127.0" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">N</text><rect x="310" y="100" width="96" height="44" rx="10" fill="#E8F0FF" stroke="#1C64F2" stroke-width="1.6"/><text x="358.0" y="127.0" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">N+1</text><rect x="420" y="100" width="96" height="44" rx="10" fill="#E8F0FF" stroke="#1C64F2" stroke-width="1.6"/><text x="468.0" y="127.0" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">N+2</text><rect x="530" y="100" width="96" height="44" rx="10" fill="#E8F0FF" stroke="#1C64F2" stroke-width="1.6"/><text x="578.0" y="127.0" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">N+3</text><rect x="640" y="100" width="96" height="44" rx="10" fill="#E8F0FF" stroke="#1C64F2" stroke-width="1.6"/><text x="688.0" y="127.0" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">N+4</text><rect x="750" y="100" width="96" height="44" rx="10" fill="#E8F0FF" stroke="#1C64F2" stroke-width="1.6"/><text x="798.0" y="127.0" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">N+5</text><rect x="860" y="100" width="96" height="44" rx="10" fill="#E8F0FF" stroke="#1C64F2" stroke-width="1.6"/><text x="908.0" y="127.0" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">N+6</text><text x="24" y="120" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Кадры TPIU</text><text x="24" y="138" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">поток трассы</text><path d="M200 220 L956 220" fill="none" stroke="#9CA3AF" stroke-width="2"/><text x="24" y="216" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Журнал событий</text><text x="24" y="234" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">поток событий</text><path d="M248 144 L248 213" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="248" cy="220" r="7" fill="#FFFFFF" stroke="#0B8EA0" stroke-width="2"/><text x="260" y="250" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">служебная метка: кадр N пришёл в T0</text><path d="M523 80 L523 212" fill="none" stroke="#D6336C" stroke-width="2" stroke-dasharray="5 4"/><circle cx="523" cy="220" r="8" fill="#D6336C"/><text x="537" y="82" font-size="13" font-weight="700" fill="#D6336C" text-anchor="start">PPS↑: время T, позиция = кадр N+3</text><path d="M908 144 L908 213" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="908" cy="220" r="7" fill="#FFFFFF" stroke="#0B8EA0" stroke-width="2"/><text x="904" y="250" font-size="12" font-weight="400" fill="#4B5563" text-anchor="end">кадр N+6 в T1</text></svg>
