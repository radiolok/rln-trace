<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="'Segoe UI','DejaVu Sans',Helvetica,Arial,sans-serif" role="img"><defs><marker id="a1C64F2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1C64F2"/></marker></defs><defs><marker id="aD6336C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D6336C"/></marker></defs><defs><marker id="a6B7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker></defs><rect x="0" y="0" width="1000" height="400" rx="14" fill="#FFFFFF"/><text x="24" y="34" font-size="18" font-weight="700" fill="#111827" text-anchor="start">Деформатор: кадры идут на выход только после двух синхрослов на границе кадра</text><text x="24" y="56" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start">Синхрослово TPIU — 0x7FFFFFFF. Период синхрослов задаёт цель (TPIU_FSCR), N и таймаут — регистры CSR.</text><rect x="40" y="140" width="200" height="84" rx="10" fill="#F4F4F5" stroke="#71717A" stroke-width="1.6"/><text x="140.0" y="171.0" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">ПОИСК</text><text x="140.0" y="190.0" font-size="12" font-weight="400" fill="#4B5563" text-anchor="middle">окно 32 бита</text><text x="140.0" y="207.0" font-size="12" font-weight="400" fill="#4B5563" text-anchor="middle">сдвиг по нибблу</text><rect x="400" y="140" width="200" height="84" rx="10" fill="#FFF8DB" stroke="#E09400" stroke-width="1.6"/><text x="500.0" y="171.0" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">ПРОВЕРКА</text><text x="500.0" y="190.0" font-size="12" font-weight="400" fill="#4B5563" text-anchor="middle">ждём синхрослово</text><text x="500.0" y="207.0" font-size="12" font-weight="400" fill="#4B5563" text-anchor="middle">через k×16 байт</text><rect x="760" y="140" width="200" height="84" rx="10" fill="#E8F0FF" stroke="#1C64F2" stroke-width="2.5"/><text x="860.0" y="171.0" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">ЗАХВАТ</text><text x="860.0" y="190.0" font-size="12" font-weight="400" fill="#4B5563" text-anchor="middle">счёт байт по mod 16</text><text x="860.0" y="207.0" font-size="12" font-weight="400" fill="#4B5563" text-anchor="middle">синхрослова вырезаются</text><path d="M240 165 L400 165" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><text x="320" y="156" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">найдено 0x7FFFFFFF</text><path d="M600 165 L760 165" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><text x="680" y="156" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">синхрослово на границе</text><path d="M400 205 L240 205" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><text x="320" y="224" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">не на границе</text><path d="M820 140 L820 104 L900 104 L900 140" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><text x="860" y="96" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">кадр или синхрослово на границе</text><path d="M820 224 L820 280 L140 280 L140 224" fill="none" stroke="#D6336C" stroke-width="1.8" marker-end="url(#aD6336C)"/><text x="480" y="272" font-size="12" font-weight="600" fill="#D6336C" text-anchor="middle">синхрослово не на границе N раз подряд</text><rect x="40" y="310" width="220" height="60" rx="10" fill="#F4F4F5" stroke="#71717A" stroke-width="1.6"/><text x="52" y="333" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Счётчики ошибок</text><text x="52" y="352" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">ресинхронизации → CSR</text><rect x="740" y="310" width="240" height="60" rx="10" fill="#E8F0FF" stroke="#1C64F2" stroke-width="1.6"/><text x="752" y="333" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Выход</text><text x="752" y="352" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">кадр 16 байт + номер кадра</text><path d="M150 280 L150 310" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M860 224 L860 310" fill="none" stroke="#1C64F2" stroke-width="1.8" marker-end="url(#a1C64F2)"/></svg>
