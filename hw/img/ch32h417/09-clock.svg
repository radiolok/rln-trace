<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 420" width="1160" height="420" font-family="'Segoe UI','DejaVu Sans',Helvetica,Arial,sans-serif" role="img"><defs><marker id="a1C64F2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1C64F2"/></marker></defs><defs><marker id="a13924F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#13924F"/></marker></defs><defs><marker id="a6B7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker></defs><rect x="0" y="0" width="1160" height="420" rx="14" fill="#FFFFFF"/><text x="24" y="34" font-size="18" font-weight="700" fill="#111827" text-anchor="start">Такт UHSIF в CH32H417</text><text x="24" y="56" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start">По тактовому дереву даташита V1.8 (рис. 1-3) и ch32h417_rcc.h. Нужен только ведущему: ведомый берёт PCLK от ПЛИС.</text><rect x="24" y="92" width="200" height="50" rx="10" fill="#F4F4F5" stroke="#71717A" stroke-width="1.6"/><text x="36" y="115" font-size="14" font-weight="700" fill="#111827" text-anchor="start">SYSCLK</text><text x="36" y="134" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">UHSIFSRC = 0, по умолчанию</text><path d="M224 117 L300 117" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><rect x="24" y="154" width="200" height="50" rx="10" fill="#F4F4F5" stroke="#71717A" stroke-width="1.6"/><text x="36" y="177" font-size="14" font-weight="700" fill="#111827" text-anchor="start">PLL_CLK</text><text x="36" y="196" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">UHSIFSRC = 1</text><path d="M224 179 L300 179" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><rect x="24" y="216" width="200" height="50" rx="10" fill="#F4F4F5" stroke="#71717A" stroke-width="1.6"/><text x="36" y="239" font-size="14" font-weight="700" fill="#111827" text-anchor="start">USBHS_PLL_CLK</text><text x="36" y="258" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">UHSIFSRC = 2</text><path d="M224 241 L300 241" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><rect x="24" y="278" width="200" height="50" rx="10" fill="#F4F4F5" stroke="#71717A" stroke-width="1.6"/><text x="36" y="301" font-size="14" font-weight="700" fill="#111827" text-anchor="start">ETH_PLL_CLK</text><text x="36" y="320" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">UHSIFSRC = 3</text><path d="M224 303 L300 303" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><path d="M300 92 L360 122 L360 278 L300 308 Z" fill="#FFF8DB" stroke="#E09400" stroke-width="1.6"/><text x="330" y="205" font-size="12" font-weight="700" fill="#111827" text-anchor="middle">MUX</text><text x="300" y="330" font-size="12" font-weight="700" fill="#4B5563" text-anchor="start">RCC_CFGR2[7:6]</text><text x="300" y="346" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">RCC_UHSIFCLKConfig()</text><rect x="420" y="168" width="220" height="74" rx="10" fill="#FFF8DB" stroke="#E09400" stroke-width="1.6"/><text x="432" y="191" font-size="14" font-weight="700" fill="#111827" text-anchor="start">UHSIFDIV  /1…/64</text><text x="432" y="210" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">RCC_CFGR2[5:0]</text><text x="432" y="227" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">= clk_div в UHSIF_GPIO_Init</text><path d="M360 205 L420 205" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><rect x="690" y="150" width="230" height="110" rx="10" fill="#E6F6EC" stroke="#13924F" stroke-width="2.5"/><text x="702" y="173" font-size="14" font-weight="700" fill="#111827" text-anchor="start">UHSIF</text><text x="702" y="192" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">RCC_HBPCENR[18] (UHSIFEN)</text><text x="702" y="209" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">ведущий: PCLK наружу</text><text x="702" y="226" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">≤ 125 МГц</text><path d="M640 205 L690 205" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><rect x="960" y="120" width="176" height="70" rx="10" fill="#E6F6EC" stroke="#13924F" stroke-width="1.6"/><text x="972" y="143" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Ведущий</text><text x="972" y="162" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">PCLK → внешнее</text><text x="972" y="179" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">ведомое устройство</text><rect x="960" y="220" width="176" height="70" rx="10" fill="#E8F0FF" stroke="#1C64F2" stroke-width="1.6"/><text x="972" y="243" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Ведомый</text><text x="972" y="262" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">PCLK ← ПЛИС</text><text x="972" y="279" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">(вход UHSIF_CLK)</text><path d="M920 180 L960 155" fill="none" stroke="#13924F" stroke-width="1.8" marker-end="url(#a13924F)"/><path d="M960 255 L920 230" fill="none" stroke="#1C64F2" stroke-width="1.8" marker-end="url(#a1C64F2)"/><text x="24" y="380" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">На рисунке даташита у мультиплексора три входа (ETH_PLL, USBHS_PLL, PLL); в заголовке WCH их четыре, код 0 — SYSCLK.</text><text x="24" y="398" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">libUHSIF.a источник не выбирает (остаётся сброшенное значение), делитель пишет только в режиме ведущего.</text></svg>
