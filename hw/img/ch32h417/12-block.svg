<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" width="1240" height="600" font-family="'Segoe UI','DejaVu Sans',Helvetica,Arial,sans-serif" role="img"><defs><marker id="a6B7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker></defs><defs><marker id="a13924F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#13924F"/></marker></defs><defs><marker id="aD6336C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D6336C"/></marker></defs><defs><marker id="a1C64F2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1C64F2"/></marker></defs><rect x="0" y="0" width="1240" height="600" rx="14" fill="#FFFFFF"/><text x="24" y="34" font-size="18" font-weight="700" fill="#111827" text-anchor="start">CH32H417 как USB3-мост: путь данных ПЛИС → ПК</text><text x="24" y="56" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start">Упрощено по рис. 1-1-1 даташита V1.8. Цветом — то, что участвует в мосте, серым — остальное.</text><rect x="24" y="220" width="150" height="110" rx="10" fill="#E8F0FF" stroke="#1C64F2" stroke-width="1.6"/><text x="36" y="243" font-size="14" font-weight="700" fill="#111827" text-anchor="start">ПЛИС</text><text x="36" y="262" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">ведущий UHSIF</text><text x="36" y="279" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">PCLK, 16/32 бита</text><rect x="204" y="84" width="820" height="470" rx="14" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6 5"/><text x="218" y="104" font-size="13" font-weight="700" fill="#4B5563" text-anchor="start">CH32H417 (QFN128) / CH32H416 (QFN88)</text><rect x="234" y="220" width="190" height="110" rx="10" fill="#E6F6EC" stroke="#13924F" stroke-width="2.5"/><text x="246" y="243" font-size="14" font-weight="700" fill="#111827" text-anchor="start">UHSIF</text><text x="246" y="262" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">4 канала × 8 буферов</text><text x="246" y="279" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">DMA по дескрипторам</text><text x="246" y="296" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">IRQ 145</text><rect x="464" y="120" width="270" height="90" rx="10" fill="#F4F4F5" stroke="#71717A" stroke-width="1.6"/><text x="476" y="143" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Ядра</text><text x="476" y="162" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">RISC-V V5F и V3F</text><text x="476" y="179" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">RV32IMAFBC + XW</text><text x="476" y="196" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">ITCM 128 КБ, DTCM 256 КБ</text><rect x="464" y="240" width="270" height="90" rx="10" fill="#E2F7F8" stroke="#0B8EA0" stroke-width="2.5"/><text x="476" y="263" font-size="14" font-weight="700" fill="#111827" text-anchor="start">RAM (общая SRAM 512 КБ)</text><text x="476" y="282" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">буферы 16 КБ = буферы</text><text x="476" y="299" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">конечной точки USB (без копий)</text><rect x="774" y="220" width="220" height="110" rx="10" fill="#E6F6EC" stroke="#13924F" stroke-width="2.5"/><text x="786" y="243" font-size="14" font-weight="700" fill="#111827" text-anchor="start">USB 3.2 Gen1</text><text x="786" y="262" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">контроллер + SS PHY</text><text x="786" y="279" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">EP1 bulk IN/OUT</text><text x="786" y="296" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">USBHS — запасной путь</text><rect x="474" y="360" width="250" height="60" rx="10" fill="#F4F4F5" stroke="#71717A" stroke-width="1.6"/><text x="486" y="383" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Шина HB, DMA1/2</text><text x="486" y="402" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">матрица шин</text><rect x="234" y="450" width="190" height="80" rx="10" fill="#F4F4F5" stroke="#71717A" stroke-width="1.6"/><text x="246" y="473" font-size="14" font-weight="700" fill="#111827" text-anchor="start">RCC, AFIO, GPIO</text><text x="246" y="492" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">такт, ремап,</text><text x="246" y="509" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">VIO18</text><rect x="474" y="450" width="520" height="80" rx="10" fill="#F4F4F5" stroke="#71717A" stroke-width="1.6"/><text x="486" y="473" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Остальное</text><text x="486" y="492" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">Ethernet 10/100 + PHY, SerDes, USB PD, SDMMC, DVP, LTDC,</text><text x="486" y="509" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">таймеры, USART, SPI, I²C, I3C, CAN, ADC/HSADC, DAC, PIOC…</text><rect x="1064" y="220" width="150" height="110" rx="10" fill="#F3EBFF" stroke="#7C3AED" stroke-width="1.6"/><text x="1076" y="243" font-size="14" font-weight="700" fill="#111827" text-anchor="start">ПК</text><text x="1076" y="262" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">USB3 SS</text><text x="1076" y="279" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">rln-trace</text><path d="M174 275 L234 275" fill="none" stroke="#1C64F2" stroke-width="3" marker-end="url(#a1C64F2)" marker-start="url(#a1C64F2)"/><text x="204" y="265" font-size="12" font-weight="600" fill="#1C64F2" text-anchor="middle">UHSIF</text><path d="M424 275 L474 285" fill="none" stroke="#D6336C" stroke-width="3" marker-end="url(#aD6336C)"/><path d="M724 285 L774 275" fill="none" stroke="#D6336C" stroke-width="3" marker-end="url(#aD6336C)"/><path d="M994 275 L1064 275" fill="none" stroke="#13924F" stroke-width="3" marker-end="url(#a13924F)" marker-start="url(#a13924F)"/><text x="1029" y="265" font-size="12" font-weight="600" fill="#13924F" text-anchor="middle">USB3</text><path d="M599 210 L599 240" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)" marker-start="url(#a6B7280)"/><path d="M599 330 L599 360" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)" marker-start="url(#a6B7280)"/><text x="234" y="360" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">В примере WCH UHSIF пишет</text><text x="234" y="376" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">прямо в USBSS_EP1_Tx_Buf,</text><text x="234" y="392" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">а USB забирает оттуда же.</text><rect x="24" y="569" width="14" height="14" rx="3" fill="#E8F0FF" stroke="#1C64F2" stroke-width="1.6"/><text x="44" y="581" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">ПЛИС</text><rect x="87.6" y="569" width="14" height="14" rx="3" fill="#E6F6EC" stroke="#13924F" stroke-width="1.6"/><text x="107.6" y="581" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">интерфейсы моста</text><rect x="240.0" y="569" width="14" height="14" rx="3" fill="#E2F7F8" stroke="#0B8EA0" stroke-width="1.6"/><text x="260.0" y="581" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">буферы</text><rect x="318.4" y="569" width="14" height="14" rx="3" fill="#F3EBFF" stroke="#7C3AED" stroke-width="1.6"/><text x="338.4" y="581" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">ПК</text><rect x="367.2" y="569" width="14" height="14" rx="3" fill="#F4F4F5" stroke="#71717A" stroke-width="1.6"/><text x="387.2" y="581" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">прочее</text></svg>
