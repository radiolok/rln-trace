<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="'Segoe UI','DejaVu Sans',Helvetica,Arial,sans-serif" role="img"><defs><marker id="a4B5563" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4B5563"/></marker></defs><defs><marker id="a6B7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker></defs><rect x="0" y="0" width="1200" height="620" rx="14" fill="#FFFFFF"/><text x="24" y="34" font-size="18" font-weight="700" fill="#111827" text-anchor="start">Питание выводов CH32H417: VDD33, VDDIO и VIO18</text><text x="24" y="56" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start">По даташиту V1.8 (разделы 1.4 и 3, табл. 3-2). Все выводы UHSIF — в домене VIO18.</text><rect x="24" y="96" width="220" height="92" rx="10" fill="#F4F4F5" stroke="#71717A" stroke-width="1.6"/><text x="36" y="119" font-size="14" font-weight="700" fill="#111827" text-anchor="start">VDD33</text><text x="36" y="138" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">3,3 В</text><text x="36" y="155" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">PA9…PA12, PC13…PC15,</text><text x="36" y="172" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">PE3…PE6</text><rect x="304" y="96" width="260" height="92" rx="10" fill="#F4F4F5" stroke="#71717A" stroke-width="1.6"/><text x="316" y="119" font-size="14" font-weight="700" fill="#111827" text-anchor="start">VDDIO</text><text x="316" y="138" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">1,65…3,6 В, не выше VDD33</text><text x="316" y="155" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">PA0…PA8, PB2…PB7, PB15, PC4,</text><text x="316" y="172" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">PC5, PD8, PE2, PF6…PF10</text><rect x="624" y="96" width="180" height="92" rx="10" fill="#FFF8DB" stroke="#E09400" stroke-width="1.6"/><text x="636" y="119" font-size="14" font-weight="700" fill="#111827" text-anchor="start">I/O LDO</text><text x="636" y="138" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">встроенный</text><text x="636" y="155" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">регулятор</text><rect x="864" y="96" width="312" height="150" rx="10" fill="#E6F6EC" stroke="#13924F" stroke-width="2.5"/><text x="876" y="119" font-size="14" font-weight="700" fill="#111827" text-anchor="start">VIO18 — выводы UHSIF</text><text x="876" y="138" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">1,2 / 1,8 / 2,5 / 3,3 В или выкл,</text><text x="876" y="155" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">PWR_CTLR[12:9] (CH32H417RM)</text><text x="876" y="172" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">PA13…15, PB0…1, PB10…14, PC0…3,</text><text x="876" y="189" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">PC6…12, PD0…7, PD9…15,</text><text x="876" y="206" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">PE0…1, PE7…15, PF0…5, PF11…14</text><path d="M244 142 L304 142" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><path d="M564 142 L624 142" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><path d="M804 142 L864 142" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a6B7280)"/><path d="M434 188 L434 226 L864 226" fill="none" stroke="#4B5563" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a4B5563)"/><text x="650" y="218" font-size="12" font-weight="600" fill="#4B5563" text-anchor="middle">или замкнуть VIO18 на VDDIO</text><text x="24" y="220" font-size="14" font-weight="700" fill="#111827" text-anchor="start">VDD33 ≥ VDD33A ≥ VDDIO ≥ VIO18</text><rect x="24" y="300" width="600" height="150" rx="10" fill="#FFF8DB" stroke="#E09400" stroke-width="1.6"/><text x="36" y="323" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Напряжение VIO18 после включения: резистор с XO на землю</text><text x="36" y="342" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">60…110 кОм (тип. 82)  → 1,2 В</text><text x="36" y="359" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">220…400 кОм (тип. 300) → 2,5 В</text><text x="36" y="376" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">≥ 1,2 МОм или ничего → 1,8 В</text><text x="36" y="393" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">3,3 В при включении не выбрать: только программно или замкнуть на VDDIO</text><text x="36" y="410" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">XO — вывод кварца HSE</text><rect x="654" y="300" width="522" height="150" rx="10" fill="#FDE8EC" stroke="#D6336C" stroke-width="2.5"/><text x="666" y="323" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Для нашей ПЛИС</text><text x="666" y="342" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">GW2AR-18: банк к UHSIF на 3,3 В или на 1,8 В.</text><text x="666" y="359" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">Банк на 3,3 В: VIO18 замкнуть на VDDIO = 3,3 В. Иначе до старта</text><text x="666" y="376" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">прошивки выводы МК при 1,8 В, а ПЛИС уже выдаёт 3,3 В в них.</text><text x="666" y="393" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">Банк на 1,8 В: XO оставить без резистора, VIO18 = 1,8 В —</text><text x="666" y="410" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">и 125 МГц в таблице WCH указаны именно при 1,8 В.</text><text x="24" y="490" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">VIO18 = 1,1…3,6 В по таблице условий; переключать можно на ходу, но при подъёме напряжения ёмкость на VDDIO должна</text><text x="24" y="508" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">быть намного больше ёмкости на VIO18 (просадка VDDIO). На VIO18 — 0,1 мкФ у каждого вывода и 2,2 мкФ у главного.</text><text x="24" y="526" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">Выбор 3,3 В против 1,8 В для UHSIF — решение для схемы адаптера; на плате проверить уровни до подключения ПЛИС.</text><rect x="24" y="585" width="14" height="14" rx="3" fill="#E6F6EC" stroke="#13924F" stroke-width="1.6"/><text x="44" y="597" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">домен выводов UHSIF</text><rect x="198.6" y="585" width="14" height="14" rx="3" fill="#FFF8DB" stroke="#E09400" stroke-width="1.6"/><text x="218.6" y="597" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">регулятор и выбор напряжения</text><rect x="439.8" y="585" width="14" height="14" rx="3" fill="#FDE8EC" stroke="#D6336C" stroke-width="1.6"/><text x="459.8" y="597" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">вывод для стенда</text></svg>
