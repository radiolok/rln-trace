<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 510" width="1140" height="510" font-family="'Segoe UI','DejaVu Sans',Helvetica,Arial,sans-serif" role="img"><defs><marker id="a6B7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker></defs><rect x="0" y="0" width="1140" height="510" rx="14" fill="#FFFFFF"/><text x="24" y="34" font-size="18" font-weight="700" fill="#111827" text-anchor="start">rln-trace: трасса, события и отладка идут на ПК по одному USB3</text><text x="24" y="56" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start">Зонд B (своя плата). Направление A — SLogic16U3 с нашей прошивкой — заменяет блоки в рамке, кроме отладки и питания цели.</text><rect x="214" y="84" width="710" height="356" rx="14" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6 5"/><text x="228" y="104" font-size="13" font-weight="700" fill="#4B5563" text-anchor="start">Зонд B</text><rect x="24" y="120" width="150" height="150" rx="10" fill="#FFF1E6" stroke="#E8590C" stroke-width="1.6"/><text x="36" y="143" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Цель</text><text x="36" y="162" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">STM32F407</text><text x="36" y="179" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">ETM → TPIU</text><text x="36" y="196" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">RISC-V: PIB</text><text x="36" y="213" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">SWD / JTAG</text><rect x="234" y="120" width="180" height="150" rx="10" fill="#FFF8DB" stroke="#E09400" stroke-width="1.6"/><text x="246" y="143" font-size="14" font-weight="700" fill="#111827" text-anchor="start">Входной каскад</text><text x="246" y="162" font-size="12" font-weight="400" fill="#4B5563" text-anchor="start">MIPI20</text><text x="246" y="179" font-si